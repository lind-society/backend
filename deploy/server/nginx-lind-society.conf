# Installed on the VPS at /etc/nginx/sites-available/lind-society and linked into
# sites-enabled. Public ports -> containers that listen on 127.0.0.1 only:
#
#   4780 guest website   -> 18080 (frontend-user)
#   4781 admin dashboard -> 18081 (frontend)
#   4782 API             -> 18082 (backend: main)
#   4783 external gateway-> 18083 (backend: external-gateway)
#
# No domain yet, so each app gets its own public port. When domains are ready,
# switch each block to `listen 80; server_name <domain>;` and run certbot.

upstream lind_web     { server 127.0.0.1:18080; keepalive 16; }
upstream lind_admin   { server 127.0.0.1:18081; keepalive 16; }
upstream lind_api     { server 127.0.0.1:18082; keepalive 16; }
upstream lind_gateway { server 127.0.0.1:18083; keepalive 16; }

# Guest website
server {
  listen 4780;
  server_name _;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    proxy_pass http://lind_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Admin dashboard
server {
  listen 4781;
  server_name _;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    proxy_pass http://lind_admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# API (also serves uploaded files at /api/v1/storages/files/...)
server {
  listen 4782;
  server_name _;

  # Video uploads are up to 100 MB each.
  client_max_body_size 512m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location / {
    proxy_pass http://lind_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }
}

# External gateway (API for partner sites)
server {
  listen 4783;
  server_name _;

  client_max_body_size 20m;

  location / {
    proxy_pass http://lind_gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
