# Installed on the VPS at /etc/nginx/sites-available/lind-society.
# No domain yet, so each app gets its own public port. When domains are ready,
# switch these to `listen 80; server_name ...;` and run certbot.

# Guest website
server {
  listen 8080;
  location / {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# Admin dashboard
server {
  listen 8081;
  location / {
    proxy_pass http://127.0.0.1:18081;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

# API (also serves uploaded files at /api/v1/storages/files/...)
server {
  listen 8082;
  # Video uploads are up to 100 MB each.
  client_max_body_size 512m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  location / {
    proxy_pass http://127.0.0.1:18082;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }
}
